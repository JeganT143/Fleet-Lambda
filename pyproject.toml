[project]
name = "fleet-lambda"
version = "0.1.0"
description = "Ride-hailing fleet operations: a small Lambda-architecture data pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
producer = ["confluent-kafka>=2.5,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
spark = ["pyspark>=3.5,<3.6"]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# the repo has an airflow/ (DAGs) directory; the `airflow` package is still third-party
known-third-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs running Docker services (Kafka / PostgreSQL)",
    "spark: needs a local Spark + Java runtime (run inside the fleet-runtime container)",
]
addopts = "-ra"
